<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Fluxo de Caixa - Login</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client (deve vir ANTES de usar) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            opacity: 0.9;
        }
        
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #fff5f5;
            border-radius: 5px;
            display: none;
        }
        
        .success-message {
            color: #22863a;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #f0f8f4;
            border-radius: 5px;
            display: none;
        }
        
        .status {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>💰 Fluxo Caixa</h1>
            <p style="color: #999; margin-top: 5px; font-size: 14px;">Gestão Financeira</p>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu-email@example.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <div class="status">
                <p id="statusText">Conectando ao servidor...</p>
            </div>
        </form>
    </div>

    <!-- Script para inicializar e testar conexão -->
    <script>
        // Aguardar Supabase carregar
        console.log('Aguardando Supabase...');
        
        // Credenciais do Supabase
        const SUPABASE_URL = 'https://xnszuirlvexhraxwny.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhuc3p1aXJsdmV4aHJheHdueSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzIwNDU2NzI0LCJleHAiOjE4NzgyMjI3MjR9.1vKUNWFfWxZLzKCH7lNeVEL-EhjHHGz6P_YL1yptLzka';
        
        // Inicializar Supabase
        let supabaseClient = null;
        
        // Função para aguardar o carregamento do Supabase
        function waitForSupabase() {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (window.supabase) {
                        clearInterval(checkInterval);
                        console.log('✅ Supabase carregado!');
                        resolve();
                    }
                }, 100);
                
                // Timeout de 5 segundos
                setTimeout(() => {
                    clearInterval(checkInterval);
                    resolve();
                }, 5000);
            });
        }
        
        // Inicializar após carregar
        waitForSupabase().then(() => {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Cliente Supabase inicializado!');
                document.getElementById('statusText').textContent = '✅ Conectado ao servidor';
            } else {
                console.error('❌ Erro: Biblioteca Supabase não carregou');
                document.getElementById('statusText').textContent = '❌ Erro ao conectar ao servidor';
                document.getElementById('statusText').style.color = '#e53e3e';
            }
        });
        
        // Event listener para o formulário
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!supabaseClient) {
                showError('Erro: Sistema não iniciou corretamente. Recarregue a página.');
                return;
            }
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            // Desabilitar botão
            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';
            
            try {
                // Fazer login
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    showError(`Erro ao entrar: ${error.message}`);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Entrar';
                    return;
                }
                
                // Login bem-sucedido
                showSuccess('✅ Login realizado com sucesso! Redirecionando...');
                
                // Redirecionar após 1 segundo
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                showError(`Erro: ${error.message}`);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            const successDiv = document.getElementById('successMessage');
            successDiv.style.display = 'none';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
        }
    </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"55d6c902a8a143b1ab6c5051b2a1f75b","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
