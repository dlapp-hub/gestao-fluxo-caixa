<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo de Caixa - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center">
    <div class="w-full max-w-md">
        <!-- CARD DE LOGIN -->
        <div class="bg-white rounded-lg shadow-2xl p-8">
            <h1 class="text-3xl font-bold text-center mb-2 text-gray-800">Fluxo de Caixa</h1>
            <p class="text-center text-gray-500 mb-8">Gestão Financeira Inteligente</p>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="loginForm" class="space-y-4">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="seu-email@example.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        required
                    >
                </div>

                <!-- Senha -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        required
                    >
                </div>

                <!-- Mensagem de erro -->
                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
                    <span id="errorText"></span>
                </div>

                <!-- Mensagem de sucesso -->
                <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
                    <span id="successText">Login realizado com sucesso! Redirecionando...</span>
                </div>

                <!-- Botão de Login -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-2 px-4 rounded-lg transition duration-200"
                >
                    Entrar
                </button>
            </form>

            <!-- Link para Registrar -->
            <p class="text-center text-gray-600 mt-6">
                Não tem conta? 
                <button type="button" id="registerLink" class="text-purple-600 hover:text-purple-800 font-semibold">
                    Registre-se aqui
                </button>
            </p>
        </div>

        <!-- CARD DE REGISTRO (Oculto inicialmente) -->
        <div id="registerCard" class="hidden bg-white rounded-lg shadow-2xl p-8 mt-4">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Criar Conta</h2>

            <form id="registerForm" class="space-y-4">
                <!-- Email -->
                <div>
                    <label for="regEmail" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        placeholder="seu-email@example.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        required
                    >
                </div>

                <!-- Senha -->
                <div>
                    <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        required
                    >
                    <p class="text-xs text-gray-500 mt-1">Mínimo 6 caracteres</p>
                </div>

                <!-- Confirmar Senha -->
                <div>
                    <label for="regPasswordConfirm" class="block text-sm font-medium text-gray-700 mb-2">Confirmar Senha</label>
                    <input 
                        type="password" 
                        id="regPasswordConfirm" 
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                        required
                    >
                </div>

                <!-- Mensagem de erro -->
                <div id="regErrorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
                    <span id="regErrorText"></span>
                </div>

                <!-- Mensagem de sucesso -->
                <div id="regSuccessMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
                    <span id="regSuccessText">Conta criada com sucesso! Faça login agora.</span>
                </div>

                <!-- Botão de Registrar -->
                <button 
                    type="submit" 
                    id="registerBtn"
                    class="w-full bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-bold py-2 px-4 rounded-lg transition duration-200"
                >
                    Criar Conta
                </button>
            </form>

            <!-- Link para Voltar ao Login -->
            <p class="text-center text-gray-600 mt-4">
                Já tem conta? 
                <button type="button" id="loginLink" class="text-purple-600 hover:text-purple-800 font-semibold">
                    Volte ao login
                </button>
            </p>
        </div>

        <!-- INDICADOR DE CONEXÃO -->
        <div id="connectionStatus" class="mt-4 text-center text-sm text-gray-300">
            <p>🔄 Testando conexão com Supabase...</p>
        </div>
    </div>

    <script>
        // ========================================
        // CONFIGURAÇÃO DO SUPABASE
        // ========================================
        const SUPABASE_URL = 'https://xnszuirlrvexehraxwny.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-gVd4d0x8-gsqDvRGmleow_iyptlzka';

        // Inicializar cliente Supabase
        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase inicializado com sucesso!');
            document.getElementById('connectionStatus').innerHTML = '✅ Conectado ao Supabase';
            document.getElementById('connectionStatus').className = 'mt-4 text-center text-sm text-green-300';
        } catch (error) {
            console.error('❌ Erro ao inicializar Supabase:', error);
            document.getElementById('connectionStatus').innerHTML = '❌ Erro de conexão com Supabase';
            document.getElementById('connectionStatus').className = 'mt-4 text-center text-sm text-red-300';
        }

        // ========================================
        // FUNÇÕES AUXILIARES
        // ========================================
        function showError(message, formType = 'login') {
            const errorDiv = formType === 'login' ? document.getElementById('errorMessage') : document.getElementById('regErrorMessage');
            const errorText = formType === 'login' ? document.getElementById('errorText') : document.getElementById('regErrorText');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 5000);
        }

        function showSuccess(message, formType = 'login') {
            const successDiv = formType === 'login' ? document.getElementById('successMessage') : document.getElementById('regSuccessMessage');
            const successText = formType === 'login' ? document.getElementById('successText') : document.getElementById('regSuccessText');
            successText.textContent = message;
            successDiv.classList.remove('hidden');
        }

        function toggleForms() {
            document.getElementById('loginForm').parentElement.classList.toggle('hidden');
            document.getElementById('registerCard').classList.toggle('hidden');
        }

        // ========================================
        // LOGIN
        // ========================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                console.log('✅ Login realizado com sucesso!');
                showSuccess('Login realizado! Redirecionando...');
                
                // Guardar token
                localStorage.setItem('supabase_token', data.session.access_token);
                
                // Redirecionar para dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Erro no login:', error.message);
                showError(error.message || 'Erro ao fazer login. Verifique suas credenciais.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });

        // ========================================
        // REGISTRO
        // ========================================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            const btn = document.getElementById('registerBtn');

            // Validações
            if (password.length < 6) {
                showError('A senha deve ter no mínimo 6 caracteres', 'register');
                return;
            }

            if (password !== passwordConfirm) {
                showError('As senhas não conferem', 'register');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Criando conta...';

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo: window.location.origin,
                    }
                });

                if (error) throw error;

                console.log('✅ Conta criada com sucesso!');
                showSuccess('Conta criada! Você pode fazer login agora.', 'register');
                
                // Limpar formulário
                document.getElementById('registerForm').reset();
                
                // Voltar ao login após 2 segundos
                setTimeout(() => {
                    toggleForms();
                }, 2000);

            } catch (error) {
                console.error('❌ Erro no registro:', error.message);
                showError(error.message || 'Erro ao criar conta', 'register');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Criar Conta';
            }
        });

        // ========================================
        // ALTERNAR ENTRE LOGIN E REGISTRO
        // ========================================
        document.getElementById('registerLink').addEventListener('click', toggleForms);
        document.getElementById('loginLink').addEventListener('click', toggleForms);

        // ========================================
        // VERIFICAR SE JÁ ESTÁ LOGADO
        // ========================================
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                console.log('✅ Usuário logado:', session.user.email);
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
